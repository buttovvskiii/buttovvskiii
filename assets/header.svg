<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="t d">
<title id="t">buttovvskiii</title>
<desc id="d">med student by day, developer by night</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#10121b"/>
<stop offset="1" stop-color="#0b0d12"/>
</linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
<feColorMatrix in="n" type="saturate" values="0"/>
</filter>
<clipPath id="panel"><rect width="1200" height="320" rx="16"/></clipPath>
</defs>
<style>
.name{font-family:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style","Hoefler Text",Georgia,"Times New Roman",serif;font-weight:400;font-size:66px;letter-spacing:2px;fill:#c8c6d4}
.sub{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:15px;letter-spacing:3.4px;fill:#74718a}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti SC",serif;font-weight:400;font-size:17px;fill:#575370}
.petal{fill:#b89aa2;opacity:.42;transform-box:fill-box;transform-origin:center;animation:drift 19s ease-in-out infinite}
@keyframes drift{
0%{transform:translate(0px,-200px) rotate(-10deg);opacity:0}
14%{opacity:.46}
50%{transform:translate(-15px,8px) rotate(16deg);opacity:.5}
86%{opacity:.34}
100%{transform:translate(11px,210px) rotate(44deg);opacity:0}
}
@media (prefers-reduced-motion:reduce){.petal{animation:none}}
</style>
<g clip-path="url(#panel)">
<rect width="1200" height="320" fill="url(#sky)"/>
<rect width="1200" height="320" filter="url(#grain)" opacity="0.035"/>
<g class="petal-wrap" transform="translate(772,152)"><path class="petal" d="M0,-8 C5,-5 6,4 0,8 C-6,4 -5,-5 0,-8 Z"/></g>
<text class="name" x="90" y="172">buttovvskiii</text>
<text class="sub" x="92" y="204">med student by day, developer by night</text>
<text class="jp" x="1150" y="96" text-anchor="middle">
<tspan x="1150" dy="0">眠</tspan>
<tspan x="1150" dy="33">れ</tspan>
<tspan x="1150" dy="33">な</tspan>
<tspan x="1150" dy="33">い</tspan>
<tspan x="1150" dy="33">夜</tspan>
</text>
<rect width="1199" height="319" x="0.5" y="0.5" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
</g>
</svg>
